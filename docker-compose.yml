version: "3.9"

services:
  backend:
    build: ./backend
    container_name: npone-copilot-backend
    restart: unless-stopped
    env_file: ./backend/.env
    volumes:
      - ./backend/vectorstore:/app/vectorstore
      - ./backend/database:/app/database
      - ./backend/logs:/app/logs
      - ./knowledge_base:/app/../knowledge_base
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - npone-net

  # Optional: self-hosted LLM. Comment out if using OPENAI provider only.
  ollama:
    image: ollama/ollama:latest
    container_name: npone-copilot-ollama
    restart: unless-stopped
    volumes:
      - ollama-data:/root/.ollama
    ports:
      - "11434:11434"
    networks:
      - npone-net

  nginx:
    image: nginx:1.27-alpine
    container_name: npone-copilot-nginx
    restart: unless-stopped
    depends_on:
      - backend
    volumes:
      - ./deployment/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend:/usr/share/nginx/html/widget-demo:ro
      - ./deployment/nginx/certs:/etc/nginx/certs:ro
    ports:
      - "80:80"
      - "443:443"
    networks:
      - npone-net

networks:
  npone-net:
    driver: bridge

volumes:
  ollama-data:
